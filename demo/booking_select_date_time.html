      min-height: max(884px, 100dvh);

<body class="bg-surface-container-lowest font-body text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- Background Light Leak Aesthetic -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[20%] -left-[10%] w-[60%] h-[60%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute top-[40%] -right-[10%] w-[40%] h-[40%] rounded-full bg-primary/10 blur-[100px]"></div>
</div>
<!-- Main Canvas: Ivory Booking Interface -->
<main class="relative w-full max-w-md bg-[#F4F1EA] rounded-[40px] shadow-2xl overflow-hidden flex flex-col h-[844px] text-inverse-on-surface">
<!-- Header Section -->
<header class="px-6 pt-8 pb-4">
<div class="flex items-center justify-between mb-6">
<button class="w-10 h-10 flex items-center justify-start text-surface-container-highest active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-semibold tracking-tight text-surface-container-highest">Book a Table</h1>
<span class="font-label text-xs font-bold tracking-widest text-outline uppercase">1 of 4</span>
</div>
<!-- Progress Bar (25%) -->
<div class="w-full h-[2px] bg-outline-variant/20 rounded-full">
<div class="w-1/4 h-full bg-primary-container rounded-full"></div>
</div>
</header>
<!-- Content Area (Scrollable) -->
<div class="flex-1 overflow-y-auto px-6 space-y-8 pb-32">
<!-- Venue Mini-Card -->
<section class="flex items-center gap-4 bg-white/40 p-3 rounded-2xl">
<div class="w-16 h-16 rounded-xl overflow-hidden shrink-0">
<img alt="Venue interior" class="w-full h-full object-cover" data-alt="Luxurious dimly lit restaurant interior with warm ambient lighting, velvet seating, and sophisticated jazz club atmosphere in Atlanta" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBUylydYIidbY8cqwnOgtP9pMg-16cey-ObxXnPz8XKDI008H7Ex1Q3I_yjtuhBJ41sAdySo-zNQYWRpZ0wL8tbuLJ8_cbkTu3mT_jEHhjuM-FpisnHcKkx082s41X8JB5UnfWbQ28mWwFQthywgy_NV-1M2Y-CmYSQqW2t0opHf7Mh0ywPusjKtBKbQzB_jkYsVfcxFubQIGdIMmwo4CvVH2qwPx0_WfKTYLd1nYIM-K15OSnrA_tju2XdNtGcwG3nxNfIhIhbNFrO"/>
</div>
<div>
<h2 class="font-headline text-lg font-bold leading-tight">Apt 4B</h2>
<p class="font-label text-xs uppercase tracking-wider text-outline">Contemporary American</p>
</div>
</section>
<!-- Date Selection -->
<section>
<div class="flex justify-between items-end mb-4">
<h3 class="font-headline text-xl italic">Select Date</h3>
<span class="font-label text-xs font-bold uppercase text-outline tracking-tighter">October 2023</span>
</div>
<div class="grid grid-cols-7 gap-y-4 text-center">
<!-- Day Labels -->
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">M</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">T</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">W</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">T</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">F</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">S</div>
<div class="text-[10px] font-bold text-outline uppercase tracking-widest">S</div>
<!-- Calendar Grid Mockup -->
<div class="text-outline/30 text-sm py-2">25</div>
<div class="text-outline/30 text-sm py-2">26</div>
<div class="text-outline/30 text-sm py-2">27</div>
<div class="text-outline/30 text-sm py-2">28</div>
<div class="text-outline/30 text-sm py-2">29</div>
<div class="text-outline/30 text-sm py-2">30</div>
<div class="text-sm py-2 font-semibold">1</div>
<div class="text-sm py-2 font-semibold">2</div>
<div class="text-sm py-2 font-semibold relative flex items-center justify-center">
<span class="relative z-10">3</span>
<div class="absolute inset-0 m-auto w-8 h-8 rounded-full border-2 border-primary-container"></div>
</div>
<div class="text-sm py-2 font-semibold">4</div>
<div class="text-sm py-2 font-semibold">5</div>
<div class="text-sm py-2 font-semibold">6</div>
<div class="text-sm py-2 font-semibold line-through text-outline/40">7</div>
<div class="text-sm py-2 font-semibold line-through text-outline/40">8</div>
</div>
</section>
<!-- Time Selection -->
<section>
<h3 class="font-headline text-xl italic mb-4">Available Times</h3>
<div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
<button class="shrink-0 px-6 py-3 rounded-full bg-white border border-outline-variant/30 text-sm font-semibold text-surface-container-highest transition-all active:scale-95">7:00 PM</button>
<button class="shrink-0 px-6 py-3 rounded-full bg-surface-container-lowest text-on-surface text-sm font-semibold shadow-lg shadow-black/20 ring-2 ring-primary transition-all scale-105">7:30 PM</button>
<button class="shrink-0 px-6 py-3 rounded-full bg-white border border-outline-variant/30 text-sm font-semibold text-surface-container-highest transition-all active:scale-95">8:00 PM</button>
<button class="shrink-0 px-6 py-3 rounded-full bg-white/40 border border-outline-variant/20 text-sm font-semibold text-outline/40 cursor-not-allowed" disabled="">8:30 PM</button>
</div>
</section>
<!-- Party Size & Occasion -->
<section class="grid grid-cols-1 gap-6">
<div class="flex items-center justify-between p-4 bg-white/60 rounded-2xl">
<div>
<h3 class="font-headline text-lg font-bold">Party Size</h3>
<p class="text-[10px] font-bold text-outline uppercase tracking-widest">Max 8 Guests</p>
</div>
<div class="flex items-center gap-6">
<button class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center active:bg-primary-container/20">
<span class="material-symbols-outlined text-sm" data-icon="remove">remove</span>
</button>
<span class="font-bold text-lg min-w-[64px] text-center">4 guests</span>
<button class="w-8 h-8 rounded-full border border-outline-variant flex items-center justify-center active:bg-primary-container/20">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>
</div>
</div>
<div class="flex items-center justify-between p-4 bg-white/60 rounded-2xl">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container" data-icon="celebration">celebration</span>
<h3 class="font-headline text-lg font-bold">Special Occasion?</h3>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant/30 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</section>
</div>
<!-- Sticky Footer CTA -->
<footer class="absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-[#F4F1EA] via-[#F4F1EA] to-transparent pt-12">
<button class="w-full h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold text-lg shadow-[0_8px_30px_rgba(230,195,100,0.3)] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</button>
</footer>
</main>
<!-- Top Navigation Bar (Shared Component Anchor) -->
<div class="fixed top-0 left-0 w-full z-[100] md:flex hidden justify-between items-center px-12 py-6 glass-effect bg-surface-container-lowest/40">
<div class="font-headline italic text-2xl text-primary font-bold">The Experience Selection</div>
<nav class="flex gap-12">
<a class="font-label text-xs uppercase tracking-[0.2em] text-primary font-bold" href="#">Curated</a>
<a class="font-label text-xs uppercase tracking-[0.2em] text-primary/40 hover:text-primary transition-colors" href="#">Booking</a>
<a class="font-label text-xs uppercase tracking-[0.2em] text-primary/40 hover:text-primary transition-colors" href="#">Circles</a>
<a class="font-label text-xs uppercase tracking-[0.2em] text-primary/40 hover:text-primary transition-colors" href="#">Vault</a>
</nav>
<button class="material-symbols-outlined text-primary" data-icon="close">close</button>
</div>
<!-- Hidden Bottom Nav for this specific task-focused journey as per instruction -->
<!-- (Suppressed for transactional flow) -->
</body></html>
