        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-surface text-on-surface font-body antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center">
<!-- Mobile Frame Simulation -->
<main class="w-full max-w-[430px] h-screen max-h-[932px] bg-surface relative overflow-hidden flex flex-col mx-auto shadow-2xl md:rounded-[40px] md:border-8 md:border-surface-container-lowest ring-1 ring-white/10">
<!-- TopAppBar (Transactional - No Navigation Shell, just a back button) -->
<header class="flex justify-between items-center px-6 h-20 w-full docked full-width top-0 bg-transparent no-border z-10 pt-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low text-on-surface hover:opacity-80 transition-opacity scale-95 active:duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-['Plus_Jakarta_Sans'] font-bold text-[#c9a84c] uppercase tracking-widest hidden">PullUpATL</div> <!-- Hidden brand for structural balance if needed later -->
<div class="w-10 h-10"></div> <!-- Spacer for flex-between balance -->
</header>
<!-- Content Canvas -->
<div class="flex-1 flex flex-col px-8 pt-12 pb-8">
<!-- Headers -->
<div class="mb-12">
<h1 class="font-headline text-4xl tracking-tight text-on-surface mb-3">Enter your code</h1>
<p class="font-body text-on-surface-variant text-base leading-relaxed max-w-[280px]">
                    We sent a 6-digit code to <br/><span class="text-on-surface font-medium">(404) ***-7821</span>
</p>
</div>
<!-- OTP Input Group -->
<div class="flex justify-between gap-2 mb-8">
<!-- Filled Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container flex items-center justify-center border-b-2 border-transparent relative">
<span class="font-headline text-2xl text-on-surface">4</span>
</div>
<!-- Filled Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container flex items-center justify-center border-b-2 border-transparent relative">
<span class="font-headline text-2xl text-on-surface">0</span>
</div>
<!-- Filled Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container flex items-center justify-center border-b-2 border-transparent relative">
<span class="font-headline text-2xl text-on-surface">4</span>
</div>
<!-- Active/Focused Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container flex items-center justify-center border-b-2 border-primary relative shadow-[0_4px_20px_-4px_rgba(230,195,100,0.15)]">
<div class="w-[2px] h-6 bg-primary animate-pulse"></div>
</div>
<!-- Empty Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container-low flex items-center justify-center border-b-2 border-transparent outline outline-1 outline-outline-variant/15 outline-offset-[-1px]">
</div>
<!-- Empty Input -->
<div class="w-12 h-14 rounded-xl bg-surface-container-low flex items-center justify-center border-b-2 border-transparent outline outline-1 outline-outline-variant/15 outline-offset-[-1px]">
</div>
</div>
<!-- Auxiliary Actions -->
<div class="flex flex-col items-center gap-4 mb-auto">
<p class="font-label text-sm text-on-surface-variant">
                    Resend code in <span class="text-primary-container font-medium">0:42</span>
</p>
<button class="font-label text-sm text-primary-container tracking-wide hover:opacity-80 transition-opacity">
                    Use a different number
                </button>
</div>
<!-- Bottom Action (Disabled State) -->
<div class="mt-auto pt-6">
<button class="w-full py-4 rounded-xl bg-surface-container-high text-on-surface-variant/50 font-label font-bold text-base tracking-wider uppercase flex items-center justify-center cursor-not-allowed transition-all duration-300 pointer-events-none">
                    Verify
                </button>
</div>
</div>
