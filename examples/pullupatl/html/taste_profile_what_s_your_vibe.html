<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PullUpATL - Taste Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                            "inverse-surface": "#e3e0f4",
                            "tertiary": "#ffb1ca",
                            "on-primary-container": "#503d00",
                            "inverse-primary": "#755b00",
                            "on-surface-variant": "#d0c5b2",
                            "surface-container-low": "#1a1a28",
                            "secondary-fixed-dim": "#c6c4df",
                            "on-tertiary-container": "#7a1345",
                            "outline": "#99907e",
                            "on-secondary-container": "#b8b6d0",
                            "surface-container-lowest": "#0d0d1a",
                            "surface-dim": "#12121f",
                            "surface-container-high": "#292937",
                            "on-primary-fixed-variant": "#584400",
                            "error": "#ffb4ab",
                            "surface-bright": "#383847",
                            "background": "#12121f",
                            "surface-container": "#1e1e2c",
                            "primary": "#e6c364",
                            "primary-fixed-dim": "#e6c364",
                            "inverse-on-surface": "#2f2f3d",
                            "tertiary-fixed-dim": "#ffb0ca",
                            "secondary": "#c6c4df",
                            "primary-fixed": "#ffe08f",
                            "on-tertiary": "#640035",
                            "on-secondary": "#2f2e43",
                            "on-error-container": "#ffdad6",
                            "on-secondary-fixed-variant": "#45455b",
                            "secondary-container": "#47475d",

                            "on-primary-fixed": "#241a00",

                            "secondary-fixed": "#e2e0fc",
                            "surface-tint": "#e6c364",
                            "tertiary-container": "#ff84b2",
                            "on-tertiary-fixed-variant": "#841c4c",
                            "on-tertiary-fixed": "#3e001f",
                            "tertiary-fixed": "#ffd9e3",
                            "surface": "#12121f",
                            "on-primary": "#3d2e00",
                            "outline-variant": "#4d4637",
                            "on-surface": "#e3e0f4",

                    "borderRadius": {

                            "full": "9999px"

                    "spacing": {},
                    "fontFamily": {
                            "headline": [
                                    "Newsreader"
                            ],
                            "body": [
                                    "Plus Jakarta Sans"

                            "label": [
                                    "Plus Jakarta Sans"
                            ]
                    }
                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body antialiased min-h-screen flex flex-col items-center justify-center bg-surface-container-lowest">
<!-- Mobile Frame Simulation -->
<div class="relative w-full max-w-[430px] h-screen max-h-[932px] bg-surface overflow-hidden shadow-2xl sm:rounded-[3rem] sm:border-8 border-surface-container-lowest flex flex-col">
<!-- Top App Bar (From Shared Components) -->
<header class="flex flex-col flex-none w-full bg-[#12121f]/80 backdrop-blur-xl shadow-[0_12px_30px_-15px_rgba(0,0,0,0.4)] bg-gradient-to-b from-[#12121f] to-transparent full-width top-0 z-50">
<div class="flex items-center justify-between px-6 h-20 w-full scale-95 active:scale-90 transition-transform">
<button class="text-[#e6c364] hover:text-[#e6c364] transition-colors duration-300 w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors duration-300">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-['Newsreader'] tracking-tight text-2xl text-[#e6c364] font-['Newsreader'] italic font-bold tracking-widest text-center flex-1 pr-10">VELVET</div>
</div>
</header>
<!-- Main Content Scrollable Area -->
<main class="flex-1 overflow-y-auto px-6 pt-8 pb-32 flex flex-col gap-8">
<!-- Header Section -->
<section class="flex flex-col gap-3">
<h1 class="font-headline text-4xl text-on-surface tracking-tight leading-tight">What's your vibe?</h1>
<p class="font-body text-on-surface-variant text-base opacity-90 leading-relaxed pr-8">Pick what moves you. We'll curate your feed.</p>
</section>
<!-- Chips Grid -->
<section class="flex flex-wrap gap-3">
<!-- Pre-selected Chips -->
<button class="px-5 py-3 rounded-full bg-primary text-on-primary font-label text-sm uppercase tracking-[0.1em] font-bold shadow-[0_12px_30px_-15px_rgba(230,195,100,0.4)] transition-all">Fine Dining</button>
<button class="px-5 py-3 rounded-full bg-primary text-on-primary font-label text-sm uppercase tracking-[0.1em] font-bold shadow-[0_12px_30px_-15px_rgba(230,195,100,0.4)] transition-all">Rooftop Bar</button>
<button class="px-5 py-3 rounded-full bg-primary text-on-primary font-label text-sm uppercase tracking-[0.1em] font-bold shadow-[0_12px_30px_-15px_rgba(230,195,100,0.4)] transition-all">Brunch Spot</button>
<button class="px-5 py-3 rounded-full bg-primary text-on-primary font-label text-sm uppercase tracking-[0.1em] font-bold shadow-[0_12px_30px_-15px_rgba(230,195,100,0.4)] transition-all">Date Night</button>
<!-- Unselected Chips -->
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Hookah Lounge</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Live Music</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Day Party</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Sports Bar</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Soul Food</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Sushi</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Caribbean</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Seafood</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Steak House</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Wine Bar</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Late Night</button>
<button class="px-5 py-3 rounded-full bg-surface-container-highest text-on-surface font-label text-sm uppercase tracking-[0.1em] font-semibold border border-outline-variant/15 transition-all hover:bg-surface-bright">Group Vibes</button>
</section>
</main>
<!-- Bottom Actions (Fixed) -->
<div class="absolute bottom-0 w-full px-6 pb-10 pt-6 bg-gradient-to-t from-surface via-surface/95 to-transparent z-40 flex flex-col gap-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 rounded-xl font-label text-sm uppercase tracking-widest font-bold shadow-[0_12px_30px_-15px_rgba(0,0,0,0.8)] active:scale-[0.98] transition-transform">
                Show Me the Spots
            </button>
<button class="w-full text-center py-2 text-on-surface-variant/70 font-body text-sm hover:text-primary transition-colors">
                Skip for now
            </button>
</div>
<!-- Note: Navigation shell suppressed as this is an onboarding/transactional screen -->
</div>
</body></html>
