<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PullUpATL - Your seat at the culture.</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,700;1,400;1,700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d1a;
            overflow: hidden;
        }

        .playfair {
            font-family: 'Playfair Display', serif;
        }

        .gold-glow {
            text-shadow: 0 0 20px rgba(230, 195, 100, 0.3);
        }

        /* Gold particle burst simulation via radial gradients */
        .particle-burst {
            background: radial-gradient(circle at center, transparent 0%, transparent 10%, rgba(201, 168, 76, 0.05) 15%, transparent 20%, rgba(201, 168, 76, 0.03) 30%, transparent 50%);
            mask-image: radial-gradient(circle at center, black 0%, transparent 70%);
        }

        /* Velvet glow at bottom */
        .velvet-anchor {
            background: radial-gradient(50% 100% at 50% 100%, rgba(132, 28, 76, 0.3) 0%, transparent 100%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-on-surface": "#2f2f3d",
                      "tertiary": "#ffb1ca",
                      "inverse-surface": "#e3e0f4",
                      "on-secondary-fixed-variant": "#45455b",
                      "on-background": "#e3e0f4",
                      "on-primary-fixed-variant": "#584400",
                      "tertiary-fixed-dim": "#ffb0ca",
                      "on-primary-container": "#503d00",
                      "surface": "#12121f",
                      "on-surface": "#e3e0f4",
                      "secondary-fixed-dim": "#c6c4df",
                      "inverse-primary": "#755b00",
                      "on-secondary-container": "#b8b6d0",
                      "primary-container": "#c9a84c",
                      "surface-bright": "#383847",
                      "surface-container": "#1e1e2c",
                      "surface-container-high": "#292937",
                      "background": "#12121f",
                      "secondary-fixed": "#e2e0fc",
                      "tertiary-container": "#ff84b2",
                      "on-tertiary-fixed-variant": "#841c4c",
                      "surface-container-lowest": "#0d0d1a",
                      "on-tertiary-fixed": "#3e001f",
                      "outline-variant": "#4d4637",
                      "on-primary": "#3d2e00",
                      "surface-dim": "#12121f",
                      "outline": "#99907e",
                      "surface-container-low": "#1a1a28",
                      "on-tertiary-container": "#7a1345",
                      "on-primary-fixed": "#241a00",
                      "surface-container-highest": "#343342",
                      "on-tertiary": "#640035",
                      "secondary": "#c6c4df",
                      "tertiary-fixed": "#ffd9e3",
                      "surface-tint": "#e6c364",
                      "on-secondary": "#2f2e43",
                      "primary-fixed": "#ffe08f",
                      "surface-variant": "#343342",
                      "primary": "#e6c364",
                      "error": "#ffb4ab",
                      "primary-fixed-dim": "#e6c364",
                      "error-container": "#93000a",
                      "on-error": "#690005",
                      "on-surface-variant": "#d0c5b2",
                      "secondary-container": "#47475d",
                      "on-error-container": "#ffdad6",
                      "on-secondary-fixed": "#1a1a2e"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Newsreader"],
                      "body": ["Plus Jakarta Sans"],
                      "label": ["Plus Jakarta Sans"]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest flex items-center justify-center min-h-screen relative overflow-hidden">
<!-- Atmospheric Overlays -->
<div class="absolute inset-0 particle-burst opacity-60"></div>
<div class="absolute inset-0 velvet-anchor h-full w-full pointer-events-none"></div>
<!-- Grain Overlay for texture -->
<div class="absolute inset-0 opacity-[0.03] pointer-events-none bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
<!-- Main Branding Cluster -->
<main class="relative z-10 flex flex-col items-center">
<!-- Stylized Logo Mark -->
<div class="relative mb-8 flex flex-col items-center">
<!-- Subtle Gold Burst Element (Static) -->
<div class="absolute inset-0 scale-[2.5] blur-3xl bg-primary/10 rounded-full"></div>
<!-- Logo Icon: Stylized Table with Crown/Flame -->
<div class="w-24 h-24 relative flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-7xl select-none" style="font-variation-settings: 'FILL' 1, 'wght' 200;">
                    restaurant
                </span>
<!-- Crown/Flame detail -->
<div class="absolute top-0 -mt-1">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1;">
                        star
                    </span>
</div>
</div>
</div>
<!-- Wordmark -->
<h1 class="playfair text-primary text-6xl md:text-7xl font-extrabold gold-glow tracking-tighter">
            PullUpATL
        </h1>
</main>
<!-- Bottom Slogan -->
<footer class="absolute bottom-16 left-0 w-full flex justify-center">
<p class="font-body text-slate-500 text-sm tracking-[0.2em] uppercase font-medium">
            Your seat at the culture.
        </p>
</footer>
<!-- Decorative Texture Lines (Asymmetrical Editorial Touch) -->
<div class="absolute top-0 left-12 w-[1px] h-32 bg-primary/10"></div>
<div class="absolute bottom-0 right-12 w-[1px] h-48 bg-primary/10"></div>
</body></html>
