<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                "on-background": "#e3e0f4",

                "on-secondary-container": "#b8b6d0",
                "background": "#12121f",
                "tertiary-fixed-dim": "#ffb0ca",
                "surface-container-lowest": "#0d0d1a",
                "on-error": "#690005",
                "on-surface": "#e3e0f4",
                "surface-tint": "#e6c364",
                "surface": "#12121f",

<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }
        .gold-glow {
            filter: drop-shadow(0 0 15px rgba(201, 168, 76, 0.15));
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-container-lowest min-h-screen flex items-center justify-center p-6">
<!-- Device Container (iPhone 15 Pro Aesthetic) -->
<div class="relative w-full max-w-[393px] h-[852px] bg-[#000000] rounded-[55px] p-[12px] shadow-2xl ring-8 ring-[#1c1c1e] overflow-hidden">
<!-- Screen Container -->
<div class="w-full h-full bg-[#FAF8F5] rounded-[44px] overflow-hidden flex flex-col relative">
<!-- Custom Minimal Header (Focused View) -->
<div class="flex items-center px-6 pt-12 pb-6 justify-between">
<div class="text-[#2D2D2D] cursor-pointer flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5" data-icon="arrow_back">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h1 class="flex-1 text-center mr-10 text-[#2D2D2D] text-lg font-bold leading-tight tracking-tight">Reset Password</h1>
</div>
<div class="flex-1 flex flex-col px-8">
<!-- Stylized Illustration -->
<div class="mt-10 mb-12 flex justify-center">
<div class="relative w-32 h-32 bg-[#1A1A2E] rounded-full flex items-center justify-center gold-glow">
<div class="text-[#C9A84C]" data-icon="key" data-weight="fill">
<span class="material-symbols-outlined text-5xl" style="font-variation-settings: 'FILL' 1;">key</span>
</div>
<!-- Decorative ring -->
<div class="absolute inset-0 rounded-full border border-[#C9A84C]/20 scale-125"></div>
</div>
</div>
<!-- Body Content -->
<div class="text-center mb-10">
<p class="text-[#2D2D2D] text-base font-normal leading-relaxed opacity-90">
                        Enter the email linked to your account and we'll send a reset link
                    </p>
</div>
<!-- Form Section -->
<div class="space-y-6">
<div class="group">
<label class="block text-xs font-bold text-[#2D2D2D] uppercase tracking-widest mb-2 ml-1">Email Address</label>
<div class="relative flex items-center">
<div class="absolute left-4 text-[#2D2D2D]/40" data-icon="mail">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-[#F0EDE8] border-none rounded-xl text-[#2D2D2D] placeholder:text-[#2D2D2D]/30 focus:ring-2 focus:ring-[#1A1A2E] transition-all duration-300" placeholder="yourname@email.com" type="email"/>
</div>
</div>
<button class="w-full h-14 bg-[#C9A84C] text-[#FAF8F5] rounded-xl font-bold text-base tracking-wide editorial-shadow active:scale-[0.98] transition-all duration-200">
                        Send Reset Link
                    </button>
</div>
<!-- Footer Navigation -->
<div class="mt-auto pb-10 text-center">
<a class="inline-flex items-center gap-2 text-[#6B7280] font-medium text-sm hover:text-[#2D2D2D] transition-colors" href="#">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
                        Back to Login
                    </a>
</div>
</div>
<!-- iOS Home Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1 bg-black/10 rounded-full"></div>
<!-- Dynamic Island -->
<div class="absolute top-2 left-1/2 -translate-x-1/2 w-[120px] h-[35px] bg-black rounded-[20px]"></div>
</div>
</div>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 bg-surface-container-lowest overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
</body></html>
