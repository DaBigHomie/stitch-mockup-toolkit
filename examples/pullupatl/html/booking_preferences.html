<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Plus+Jakarta+Sans:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#1e1e2c",
                        "on-secondary": "#2f2e43",
                        "inverse-surface": "#e3e0f4",
                        "on-primary-fixed": "#241a00",
                        "tertiary": "#ffb1ca",
                        "background": "#12121f",
                        "surface-container-low": "#1a1a28",
                        "on-primary-container": "#503d00",
                        "secondary-fixed": "#e2e0fc",
                        "on-secondary-fixed": "#1a1a2e",
                        "secondary-container": "#47475d",
                        "on-background": "#e3e0f4",
                        "inverse-on-surface": "#2f2f3d",
                        "error": "#ffb4ab",
                        "outline": "#99907e",
                        "surface-tint": "#e6c364",
                        "surface": "#12121f",
                        "tertiary-container": "#ff84b2",
                        "on-secondary-container": "#b8b6d0",
                        "on-primary": "#3d2e00",
                        "surface-bright": "#383847",
                        "surface-dim": "#12121f",
                        "inverse-primary": "#755b00",
                        "tertiary-fixed-dim": "#ffb0ca",
                        "on-error": "#690005",
                        "secondary-fixed-dim": "#c6c4df",
                        "primary": "#e6c364",
                        "on-primary-fixed-variant": "#584400",
                        "surface-container-high": "#292937",
                        "on-error-container": "#ffdad6",
                        "error-container": "#93000a",
                        "secondary": "#c6c4df",
                        "on-tertiary-fixed-variant": "#841c4c",
                        "on-tertiary-fixed": "#3e001f",
                        "surface-container-lowest": "#0d0d1a",
                        "on-secondary-fixed-variant": "#45455b",
                        "on-surface": "#e3e0f4",
                        "on-tertiary": "#640035",
                        "primary-container": "#c9a84c",
                        "surface-variant": "#343342",
                        "outline-variant": "#4d4637",
                        "surface-container-highest": "#343342",
                        "primary-fixed": "#ffe08f",
                        "on-surface-variant": "#d0c5b2",
                        "tertiary-fixed": "#ffd9e3",
                        "primary-fixed-dim": "#e6c364",
                        "on-tertiary-container": "#7a1345"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Newsreader", "serif"],
                        "body": ["Plus Jakarta Sans", "sans-serif"],
                        "label": ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .ivory-bg { background-color: #FAF8F5; }
        .warm-gray-bg { background-color: #F0EDE8; }
        .midnight-bg { background-color: #1A1A2E; }
        .gold-bg { background-color: #C9A84C; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#0D0D1A] font-body text-on-surface min-h-screen flex items-center justify-center p-4">
<!-- iPhone 15 Pro Mockup Container -->
<div class="relative w-[393px] h-[852px] bg-background rounded-[55px] shadow-[0_0_80px_rgba(230,195,100,0.15)] border-[8px] border-surface-container-highest overflow-hidden flex flex-col">
<!-- Status Bar Space -->
<div class="h-12 w-full"></div>
<!-- TopAppBar (From JSON Mapping) -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-gradient-to-b from-[#12121f] to-transparent z-10">
<button class="text-slate-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline italic text-2xl tracking-tight text-[#e6c364] leading-tight">Preferences</h1>
<span class="text-[10px] uppercase tracking-[0.2em] text-slate-500 font-bold">Step 2 of 4</span>
</div>
<button class="text-slate-400 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</header>
<!-- Progress Bar -->
<div class="w-full h-[2px] bg-surface-container px-6">
<div class="h-full gold-bg w-1/2 transition-all duration-500 shadow-[0_0_8px_#C9A84C]"></div>
</div>
<!-- Main Canvas: Ivory Background -->
<main class="flex-1 ivory-bg overflow-y-auto no-scrollbar pb-32">
<div class="px-6 pt-8 space-y-10">
<!-- Section 1: Seating Preference -->
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-[11px] uppercase tracking-[0.15em] font-bold text-on-secondary-fixed-variant">Seating Preference</h2>
<span class="h-[1px] flex-1 ml-4 bg-outline-variant/20"></span>
</div>
<div class="flex gap-2 overflow-x-auto no-scrollbar py-2">
<button class="px-5 py-2.5 rounded-xl midnight-bg text-[#FAF8F5] text-sm font-semibold whitespace-nowrap shadow-lg shadow-black/10">Indoor</button>
<button class="px-5 py-2.5 rounded-xl warm-gray-bg text-[#1A1A2E] text-sm font-semibold whitespace-nowrap border border-transparent hover:border-outline-variant/30 transition-all">Outdoor</button>
<button class="px-5 py-2.5 rounded-xl warm-gray-bg text-[#1A1A2E] text-sm font-semibold whitespace-nowrap">Bar</button>
<button class="px-5 py-2.5 rounded-xl warm-gray-bg text-[#1A1A2E] text-sm font-semibold whitespace-nowrap">Private Room</button>
<button class="px-5 py-2.5 rounded-xl warm-gray-bg text-[#1A1A2E] text-sm font-semibold whitespace-nowrap">Window</button>
</div>
</section>
<!-- Section 2: Dining Occasion -->
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-[11px] uppercase tracking-[0.15em] font-bold text-on-secondary-fixed-variant">Dining Occasion</h2>
<span class="h-[1px] flex-1 ml-4 bg-outline-variant/20"></span>
</div>
<div class="relative">
<!-- Dropdown Trigger -->
<div class="w-full p-4 rounded-xl warm-gray-bg border border-outline-variant/20 flex justify-between items-center group cursor-pointer ring-offset-2 ring-primary/20 transition-all">
<span class="font-semibold text-[#1A1A2E] text-lg">Casual Dinner</span>
<span class="material-symbols-outlined text-[#1A1A2E]">expand_more</span>
</div>
<!-- Dropdown List (Simulated Visible) -->
<div class="mt-3 overflow-hidden rounded-xl bg-white/80 backdrop-blur-md border border-outline-variant/10 shadow-xl">
<div class="p-1 space-y-0.5">
<div class="px-4 py-3 text-[#1A1A2E] font-medium hover:bg-primary/10 cursor-pointer transition-colors flex justify-between items-center">
                                    Birthday <span class="material-symbols-outlined text-xs opacity-0">cake</span>
</div>
<div class="px-4 py-3 text-[#1A1A2E] font-medium hover:bg-primary/10 cursor-pointer transition-colors">Anniversary</div>
<div class="px-4 py-3 text-[#1A1A2E] font-medium hover:bg-primary/10 cursor-pointer transition-colors">Business</div>
<div class="px-4 py-3 text-[#1A1A2E] font-medium hover:bg-primary/10 cursor-pointer transition-colors">Celebration</div>
<div class="px-4 py-3 text-[#1A1A2E] font-medium hover:bg-primary/10 cursor-pointer transition-colors">Just Dinner</div>
</div>
</div>
</div>
</section>
<!-- Section 3: Special Requests -->
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-[11px] uppercase tracking-[0.15em] font-bold text-on-secondary-fixed-variant">Special Requests</h2>
<span class="h-[1px] flex-1 ml-4 bg-outline-variant/20"></span>
</div>
<textarea class="w-full p-4 rounded-xl warm-gray-bg border border-outline-variant/30 text-[#1A1A2E] placeholder:text-slate-400 focus:ring-1 focus:ring-primary focus:border-primary transition-all resize-none font-medium text-sm" placeholder="Allergies, accessibility needs, surprises..." rows="3"></textarea>
</section>
<!-- Section 4: Add to Reservation -->
<section class="space-y-4">
<div class="flex items-center justify-between mb-2">
<h2 class="text-[11px] uppercase tracking-[0.15em] font-bold text-on-secondary-fixed-variant">Add to Reservation</h2>
<span class="h-[1px] flex-1 ml-4 bg-outline-variant/20"></span>
</div>
<!-- Toggle 1 -->
<div class="flex items-center justify-between p-4 rounded-xl warm-gray-bg/50 border border-outline-variant/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#1A1A2E] opacity-60">child_care</span>
<span class="font-semibold text-[#1A1A2E]">High chair needed</span>
</div>
<div class="w-12 h-6 bg-slate-300 rounded-full relative p-1 cursor-pointer">
<div class="w-4 h-4 bg-white rounded-full transition-transform duration-200"></div>
</div>
</div>
<!-- Toggle 2 -->
<div class="flex items-center justify-between p-4 rounded-xl warm-gray-bg/50 border border-outline-variant/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#1A1A2E] opacity-60">accessible_forward</span>
<span class="font-semibold text-[#1A1A2E]">Accessibility needs</span>
</div>
<div class="w-12 h-6 bg-slate-300 rounded-full relative p-1 cursor-pointer">
<div class="w-4 h-4 bg-white rounded-full transition-transform duration-200"></div>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Navigation & Button -->
<div class="absolute bottom-0 w-full z-20 pb-8 pt-4 px-6 bg-gradient-to-t from-[#FAF8F5] via-[#FAF8F5] to-transparent">
<button class="w-full gold-bg text-[#12121f] font-bold text-sm uppercase tracking-widest py-5 rounded-xl shadow-xl shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
                Continue
            </button>
</div>
<!-- Decorative Elements -->
<div class="absolute -top-20 -right-20 w-64 h-64 bg-primary/10 blur-[100px] rounded-full"></div>
<div class="absolute -bottom-20 -left-20 w-64 h-64 bg-primary/5 blur-[100px] rounded-full"></div>
</div>
</body></html>
